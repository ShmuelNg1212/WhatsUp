{# A single post. Expects `post` from posts.queries.annotated_posts(). #}
{% load humanize %}
<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" id="post-{{ post.pk }}">
  <header class="flex items-center justify-between">
    <span class="font-semibold">{{ post.author.username }}</span>
    <time class="text-xs text-slate-500" datetime="{{ post.created_at|date:'c' }}">{{ post.created_at|naturaltime }}</time>
  </header>
  <p class="mt-3 whitespace-pre-line break-words">{{ post.body }}</p>
  {% if post.image %}
    <img src="{{ post.image.url }}" alt="Image attached to {{ post.author.username }}'s post" class="mt-3 max-h-[32rem] w-full rounded-xl object-cover">
  {% endif %}
  <footer class="mt-4 flex gap-4 text-sm text-slate-600">
    <span>♥ {{ post.like_count }}</span>
    <span>💬 {{ post.comment_count }}</span>
  </footer>
</article>
