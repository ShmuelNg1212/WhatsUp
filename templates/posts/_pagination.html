{% if page_obj.has_other_pages %}
<nav class="mt-6 flex items-center justify-between text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn btn-secondary" href="?page={{ page_obj.previous_page_number }}">← Newer</a>{% else %}<span></span>{% endif %}
  <span class="text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-secondary" href="?page={{ page_obj.next_page_number }}">Older →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
