{% extends "base.html" %}
{% block title %}Delete ad{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-2xl border border-red-200 bg-white p-8 shadow-sm">
  <h1 class="text-xl font-bold">Delete the ad “{{ object.headline }}”?</h1>
  <p class="mt-3 text-slate-600">It will be removed from the campaign “{{ campaign.name }}”. This can't be undone.</p>
  <form method="post" class="mt-6 flex gap-3">
    {% csrf_token %}
    <button type="submit" class="btn bg-red-600 text-white hover:bg-red-700">Yes, delete</button>
    <a href="{{ campaign.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
