{% extends "base.html" %}
{% block title %}{% if object %}Edit {{ object.name }}{% else %}New campaign{% endif %}{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'ads:dashboard' %}{% endif %}" class="text-sm text-indigo-600 hover:underline">← Back</a>
  <div class="mt-4 rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-bold">{% if object %}Edit campaign{% else %}New campaign{% endif %}</h1>
    <form method="post" class="form-stack" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-full">{% if object %}Save changes{% else %}Create campaign{% endif %}</button>
    </form>
  </div>
</div>
{% endblock %}
