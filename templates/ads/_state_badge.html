{# Expects `campaign`. #}
{% with state=campaign.state %}
<span class="rounded-full px-2.5 py-0.5 text-xs font-medium
  {% if state == 'live' %}bg-emerald-100 text-emerald-800{% elif state == 'scheduled' %}bg-sky-100 text-sky-800{% elif state == 'ended' %}bg-slate-200 text-slate-700{% else %}bg-amber-100 text-amber-800{% endif %}"
  data-state="{{ state }}">{{ state.label }}</span>
{% endwith %}
