{# A sponsored ad, styled to sit natively among posts in the feed. Expects `ad` and `sponsor`. #}
<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" data-ad-unit="{{ ad.pk }}">
  <header class="flex items-center justify-between">
    <span class="font-semibold">{{ sponsor }}</span>
    <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-500">Sponsored</span>
  </header>
  <h3 class="mt-3 text-lg font-semibold">{{ ad.headline }}</h3>
  <p class="mt-1 whitespace-pre-line break-words text-slate-700">{{ ad.body }}</p>
  {% if ad.image %}
    <img src="{{ ad.image.url }}" alt="{{ ad.headline }}" class="mt-3 max-h-[32rem] w-full rounded-xl object-cover">
  {% endif %}
  <a href="{{ ad.target_url }}" target="_blank" rel="sponsored noopener noreferrer"
     class="btn btn-secondary mt-4 w-full text-center text-sm">Learn more ↗</a>
</article>
