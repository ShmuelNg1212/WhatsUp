{% comment %}
  Follow / Unfollow toggle (POST).
  Expects `target` (a User) and `following` (bool).
  Optional: testid (default "follow-button"), size ("sm" default | "md").
{% endcomment %}
<form method="post" action="{% url 'posts:follow' target.username %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="btn {% if following %}btn-secondary{% else %}btn-primary{% endif %}{% if size != 'md' %} btn-sm{% endif %}"
          data-testid="{{ testid|default:'follow-button' }}" data-following="{{ following|yesno:'true,false' }}">{% if following %}Unfollow{% else %}Follow{% endif %}</button>
</form>
