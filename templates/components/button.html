{% comment %}
  Button or link-button.
    label     text (required)
    variant   primary (default) | secondary | ghost | danger
    href      render an <a> instead of a <button>
    type      button type (default "submit")
    icon      icon name (components/icon.html)
    size      "sm" for compact
    full      True for full width
    extra     extra classes
    testid    data-testid
{% endcomment %}
{% if href %}<a href="{{ href }}"{% else %}<button type="{{ type|default:'submit' }}"{% endif %}
  class="btn btn-{{ variant|default:'primary' }}{% if size == 'sm' %} btn-sm{% endif %}{% if full %} w-full{% endif %}{% if extra %} {{ extra }}{% endif %}"
  {% if testid %}data-testid="{{ testid }}"{% endif %}>{% if icon %}{% include "components/icon.html" with name=icon cls="h-4 w-4" only %}{% endif %}<span>{{ label }}</span>{% if href %}</a>{% else %}</button>{% endif %}
