{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
  <h1 class="mb-6 text-2xl font-bold">Log in</h1>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary w-full">Log in</button>
  </form>
  <p class="mt-6 text-center text-sm text-slate-600">
    New here? <a href="{% url 'signup' %}" class="font-medium text-indigo-600 hover:underline">Sign up</a>
    or <a href="{% url 'signup_advertiser' %}" class="font-medium text-indigo-600 hover:underline">advertise with us</a>.
  </p>
</div>
{% endblock %}
